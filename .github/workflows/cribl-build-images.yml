# Cribl-side image build pipeline.
#
# Builds and pushes images for components that we carry Cribl-only patches
# on, so the parent repo (criblio/otel-demo-criblcloud) can reference them
# in helm-values without anyone needing the upstream chart's prebuilt
# images.
#
# Triggers on pushes to cribl/* branches. Each tag is <short-sha>-<component>
# so commits on the branch produce immutable, traceable images.
name: cribl-build-images

on:
  push:
    branches:
      - 'cribl/**'
  workflow_dispatch:
    inputs:
      components:
        description: 'Comma-separated component names to build (default: all)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/criblio/opentelemetry-demo

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add a component here once we've landed Cribl patches for it.
        # Note: cart's Dockerfile lives at src/cart/src/Dockerfile, not
        # src/cart/Dockerfile — `dockerfile` overrides the convention when set.
        include:
          - component: load-generator
          - component: accounting
          - component: cart
            dockerfile: src/cart/src/Dockerfile
          - component: checkout
          - component: currency
            build-args: |
              OPENTELEMETRY_CPP_VERSION=1.24.0
          - component: payment
          - component: recommendation
          - component: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile || format('./src/{0}/Dockerfile', matrix.component) }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.sha.outputs.short }}-${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
